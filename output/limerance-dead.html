        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    overflow: hidden;
    position: relative;
}

/* Control Buttons */
.timer-controls {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1rem;
    z-index: 1000;
    padding: 1rem;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.control-btn {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.2) 0%, rgba(0, 204, 106, 0.2) 100%);
    color: #00ff88;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid rgba(0, 255, 136, 0.3);
}

.control-btn:hover {
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.4) 0%, rgba(0, 204, 106, 0.4) 100%);
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    transform: translateY(-2px);
}

.control-btn:active {
    transform: translateY(0);
}

/* Display Name */
.timer-display-name {
    position: fixed;
    top: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.5rem;
    font-weight: bold;
    color: #00ff88;
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    z-index: 1000;
    text-align: center;
    padding: 0.5rem 1rem;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    border: 1px solid rgba(0, 255, 136, 0.2);
}

/* Mobile Responsive */
@media (max-width: 768px) {
    .timer-controls {
        bottom: 1rem;
        gap: 0.5rem;
        padding: 0.75rem;
    }

    .control-btn {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
    }

    .timer-display-name {
        top: 1rem;
        font-size: 1.2rem;
    }
}

@media (max-width: 480px) {
    .timer-controls {
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 2rem);
        justify-content: center;
    }

    .control-btn {
        flex: 1;
        max-width: 120px;
    }

    .timer-display-name {
        font-size: 1rem;
        max-width: calc(100% - 2rem);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
}

/* Fullscreen styles */
:fullscreen body {
    background: #0a0a15;
}

:fullscreen .timer-controls {
    bottom: 3rem;
}

.display {
    display: flex;
    gap: 1vw;
    justify-content: center;
    align-items: center;
}

/* ============================================
   VERSION WATERMARK
   ============================================ */

.version-watermark {
    position: fixed;
    bottom: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    padding: 6px 10px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.6);
    opacity: 0;
    pointer-events: none;
    z-index: 10000;
    transition: opacity 0.3s;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

/* Show watermark when hovering near bottom-right corner */
.version-watermark.visible {
    opacity: 0.5;
}

.version-watermark:hover {
    opacity: 0.9 !important;
}

.version-label {
    font-weight: bold;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0.8;
}

.version-date {
    font-size: 9px;
    opacity: 0.5;
}

/* Stable version - subtle green tint */
.version-watermark[data-version="STABLE"] {
    border-color: rgba(0, 255, 136, 0.3);
    color: rgba(0, 255, 136, 0.5);
}

.version-watermark[data-version="STABLE"] .version-label {
    color: rgba(0, 255, 136, 0.7);
}

/* Experimental version - subtle orange tint */
.version-watermark[data-version="EXPERIMENTAL"] {
    border-color: rgba(255, 165, 0, 0.3);
    color: rgba(255, 165, 0, 0.5);
}

.version-watermark[data-version="EXPERIMENTAL"] .version-label {
    color: rgba(255, 165, 0, 0.7);
}

/* Fresh build (updated today) - bright cyan/green */
.version-watermark[data-age="fresh"] {
    border-color: rgba(0, 255, 200, 0.5) !important;
    color: rgba(0, 255, 200, 0.8) !important;
    opacity: 0.7;
}

.version-watermark[data-age="fresh"] .version-label {
    color: rgba(0, 255, 200, 1) !important;
}

/* Old build (not updated today) - warning orange/red */
.version-watermark[data-age="old"] {
    border-color: rgba(255, 69, 0, 0.5) !important;
    color: rgba(255, 69, 0, 0.8) !important;
    opacity: 0.7;
}

.version-watermark[data-age="old"] .version-label {
    color: rgba(255, 69, 0, 1) !important;
}

/* Responsive */
@media (max-width: 768px) {
    .version-watermark {
        bottom: 5px;
        right: 5px;
        padding: 4px 8px;
        font-size: 9px;
    }

    .version-label {
        font-size: 10px;
    }

    .version-date {
        font-size: 8px;
    }
}

/* ============================================
   EXPIRED STATE STYLES
   ============================================ */

/* Expired body state - triggers pulse animation */
body.expired {
    animation: expiredPulse 2s ease-in-out infinite;
}

@keyframes expiredPulse {
    0%, 100% {
        background: #1a1a2e;
    }
    50% {
        background: #2a1a1e;
    }
}

/* Expired segments - red flash */
body.expired .segment-part.on {
    animation: expiredFlash 1s ease-in-out infinite;
}

@keyframes expiredFlash {
    0%, 100% {
        background: #ff0000;
        box-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000, 0 0 45px #ff0000;
    }
    50% {
        background: #ff4444;
        box-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000, 0 0 75px #ff0000;
    }
}

/* Expired colon dots - red flash */
body.expired .colon-dot.on {
    animation: expiredFlash 1s ease-in-out infinite;
}

/* ============================================
   EXPIRED MESSAGE STYLES (for on_expire: hide)
   ============================================ */

.expired-message {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    animation: expiredMessagePulse 2s ease-in-out infinite;
}

.expired-text {
    font-size: 8vw;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    color: #ff0000;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000;
    letter-spacing: 0.5rem;
    animation: expiredTextFlash 1.5s ease-in-out infinite;
}

.expired-subtext {
    font-size: 2vw;
    color: #ff6666;
    text-shadow: 0 0 10px #ff0000;
    letter-spacing: 0.2rem;
}

@keyframes expiredMessagePulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.02);
    }
}

@keyframes expiredTextFlash {
    0%, 100% {
        opacity: 1;
        text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000;
    }
    50% {
        opacity: 0.7;
        text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000, 0 0 90px #ff0000;
    }
}

/* ============================================
   MINUS SIGN FOR NEGATIVE TIME (Dark Pink)
   ============================================ */

.minus-sign {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin-right: 0.5vw;
}

.minus-bar {
    width: 3vw;
    height: 0.8vw;
    background: #ff1493;
    border-radius: 2px;
    box-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493;
    animation: minusPulse 2s ease-in-out infinite;
}

@keyframes minusPulse {
    0%, 100% {
        opacity: 1;
        box-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493;
    }
    50% {
        opacity: 0.8;
        box-shadow: 0 0 15px #ff1493, 0 0 30px #ff1493;
    }
}

/* ============================================
   RESPONSIVE STYLES
   ============================================ */

@media (max-width: 768px) {
    .expired-text {
        font-size: 12vw;
    }
    
    .expired-subtext {
        font-size: 4vw;
    }
    
    .minus-bar {
        width: 5vw;
        height: 1.2vw;
    }
}

    <div class="version-watermark" data-version="STABLE" data-build="2.0.0.20260327123005.stable">

    </div>

    <script>
        
        // ============ CONFIGURATION ============
// Hardcoded defaults (fallback if fetch/cache fail)
const DEFAULTS = {
    target_time: '2026-03-24T00:00:00',
    start_time: '2026-03-17T00:00:00',
    display_name: '',
    config_id: 'default',
    on_expire: 'stop',  // Options: 'stop', 'continue', 'hide'
    direction: 'down',  // Options: 'down', 'up'
    min_value: 0,       // Minimum value in milliseconds (null for no limit)
    max_value: null,     // Maximum value in milliseconds (null for no limit)
    // Smooth color transition: Blue→Cyan→Green→Yellow→Orange→Red→Violet→Deep Violet
    color_transition_table: [
        { ratio: 1.0, color: '#0088ff' },   // Blue: 100% remaining
        { ratio: 0.9, color: '#00aaff' },   // Blue-Cyan: 90%
        { ratio: 0.8, color: '#00ccff' },   // Cyan-Blue: 80%
        { ratio: 0.75, color: '#00ff00' },  // Green: 75%
        { ratio: 0.6, color: '#80ff00' },   // Lime-Green: 60%
        { ratio: 0.5, color: '#ffff00' },   // Yellow: 50%
        { ratio: 0.4, color: '#ffcc00' },   // Yellow-Orange: 40%
        { ratio: 0.3, color: '#ffaa00' },   // Orange-Yellow: 30%
        { ratio: 0.25, color: '#ff8800' },  // Orange: 25%
        { ratio: 0.2, color: '#ff6600' },   // Orange-Red: 20%
        { ratio: 0.1, color: '#ff4400' },   // Red-Orange: 10%
        { ratio: 0.0, color: '#ff0000' },   // Red: 0% (zero)
        { ratio: -0.25, color: '#ff0080' }, // Red-Magenta: -25%
        { ratio: -0.5, color: '#ee82ee' },  // Violet: -50%
        { ratio: -0.75, color: '#c060ff' }, // Violet-Purple: -75%
        { ratio: -1.0, color: '#8b00ff' }   // Deep Violet: -100%
    ]
};
const MILLISECONDS_AT_FULL_BRIGHTNESS = 0;
const CONFIG_URL = 'https://raw.githubusercontent.com/Astraxical/displau/refs/heads/master/timers/inactive/limerance-dead.json'; // Injected by build script
// =======================================

// Cache configuration
const CACHE_KEY = 'seven_segment_config';
const CACHE_DURATION_MS = 5 * 60 * 1000; // 5 minutes

// Notification state
let notificationPermission = 'default'; // 'default', 'granted', 'denied'

// Color state
let currentColor = '#00ff00';
let targetColor = '#00ff00';
let colorTransitionProgress = 1;

// Runtime config (will be populated)
let TARGET_TIME = DEFAULTS.target_time;
let START_TIME = DEFAULTS.start_time;
let DISPLAY_NAME = DEFAULTS.display_name;
let ON_EXPIRE = DEFAULTS.on_expire;
let DIRECTION = DEFAULTS.direction;
let MIN_VALUE = DEFAULTS.min_value;
let MAX_VALUE = DEFAULTS.max_value;
let COLOR_TRANSITION_TABLE = DEFAULTS.color_transition_table;

/**
 * Load config from GitHub with localStorage caching
 * Falls back to hardcoded defaults if fetch fails
 */
async function loadConfig() {
    const now = Date.now();
    
    // Try localStorage cache first
    try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
            const { config, timestamp } = JSON.parse(cached);
            if (now - timestamp < CACHE_DURATION_MS) {
                console.log('[Config] Using cached config');
                applyConfig(config);
                return config;
            }
        }
    } catch (e) {
        console.warn('[Config] Cache read error:', e);
    }
    
    // Try fetch from GitHub
    if (CONFIG_URL && CONFIG_URL !== 'https://raw.githubusercontent.com/Astraxical/displau/refs/heads/master/timers/inactive/limerance-dead.json') {
        try {
            console.log('[Config] Fetching config from:', CONFIG_URL);
            const response = await fetch(CONFIG_URL, {
                cache: 'no-cache'
            });
            if (response.ok) {
                const config = await response.json();
                // Save to cache
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    config,
                    timestamp: now
                }));
                console.log('[Config] Loaded from GitHub');
                applyConfig(config);
                return config;
            }
        } catch (e) {
            console.warn('[Config] Fetch error, using fallback:', e);
        }
    }
    
    // Fallback to hardcoded defaults
    console.log('[Config] Using hardcoded defaults');
    applyConfig(DEFAULTS);
    return DEFAULTS;
}

/**
 * Apply loaded config to runtime variables
 */
function applyConfig(config) {
    if (config.target_time) {
        TARGET_TIME = config.target_time;
    }
    // Use start_time from config if available, otherwise keep embedded default
    if (config.start_time) {
        START_TIME = config.start_time;
    }
    // Use display_name from config if available
    if (config.display_name) {
        DISPLAY_NAME = config.display_name;
    }
    // Use on_expire from config if available
    if (config.on_expire) {
        ON_EXPIRE = config.on_expire;
    }
    // Use direction from config if available
    if (config.direction) {
        DIRECTION = config.direction;
    }
    // Use min_value from config if available
    if (config.min_value !== undefined) {
        MIN_VALUE = config.min_value;
    }
    // Use max_value from config if available
    if (config.max_value !== undefined) {
        MAX_VALUE = config.max_value;
    }
    // Use color_transition_table from config if available
    if (config.color_transition_table && Array.isArray(config.color_transition_table)) {
        COLOR_TRANSITION_TABLE = config.color_transition_table;
    }
}

// Initialize config on script load
loadConfig();

// Check notification permission on load
if ('Notification' in window) {
    notificationPermission = Notification.permission;
    console.log('[Config] Notification permission:', notificationPermission);
}

function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
    } : { r: 0, g: 255, b: 0 };
}

function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? '0' + hex : hex;
    }).join('');
}

function lerpColor(color1, color2, t) {
    const c1 = hexToRgb(color1);
    const c2 = hexToRgb(color2);
    return rgbToHex(
        c1.r + (c2.r - c1.r) * t,
        c1.g + (c2.g - c1.g) * t,
        c1.b + (c2.b - c1.b) * t
    );
}

/**
 * Get color from transition table based on remaining ratio
 * Supports negative ratios for negative time (beyond zero)
 * @param {number} remainingRatio - Ratio of time remaining (can be negative for overtime)
 * @returns {string} Hex color string
 */
function getColorForRemainingRatio(remainingRatio) {
    // Smooth color transition: Blue→Cyan→Green→Yellow→Orange→Red→Violet→Deep Violet
    const defaultTable = [
        { ratio: 1.0, color: '#0088ff' },   // Blue: 100% remaining
        { ratio: 0.9, color: '#00aaff' },   // Blue-Cyan: 90%
        { ratio: 0.8, color: '#00ccff' },   // Cyan-Blue: 80%
        { ratio: 0.75, color: '#00ff00' },  // Green: 75%
        { ratio: 0.6, color: '#80ff00' },   // Lime-Green: 60%
        { ratio: 0.5, color: '#ffff00' },   // Yellow: 50%
        { ratio: 0.4, color: '#ffcc00' },   // Yellow-Orange: 40%
        { ratio: 0.3, color: '#ffaa00' },   // Orange-Yellow: 30%
        { ratio: 0.25, color: '#ff8800' },  // Orange: 25%
        { ratio: 0.2, color: '#ff6600' },   // Orange-Red: 20%
        { ratio: 0.1, color: '#ff4400' },   // Red-Orange: 10%
        { ratio: 0.0, color: '#ff0000' },   // Red: 0% (zero)
        { ratio: -0.25, color: '#ff0080' }, // Red-Magenta: -25%
        { ratio: -0.5, color: '#ee82ee' },  // Violet: -50%
        { ratio: -0.75, color: '#c060ff' }, // Violet-Purple: -75%
        { ratio: -1.0, color: '#8b00ff' }   // Deep Violet: -100%
    ];

    // Use the color transition table from config
    const table = COLOR_TRANSITION_TABLE || defaultTable;

    // Sort table by ratio (descending)
    const sortedTable = [...table].sort((a, b) => b.ratio - a.ratio);

    // Find the two entries that bracket our ratio
    for (let i = 0; i < sortedTable.length - 1; i++) {
        const entry1 = sortedTable[i];
        const entry2 = sortedTable[i + 1];

        if (remainingRatio <= entry1.ratio && remainingRatio >= entry2.ratio) {
            // Calculate interpolation factor (0 to 1)
            const range = entry1.ratio - entry2.ratio;
            const t = range === 0 ? 0 : (entry1.ratio - remainingRatio) / range;

            // Interpolate between the two colors
            return lerpColor(entry1.color, entry2.color, t);
        }
    }

    // If ratio is outside all ranges, return the edge color
    if (remainingRatio > sortedTable[0].ratio) {
        return sortedTable[0].color;
    }
    return sortedTable[sortedTable.length - 1].color;
}

/**
 * Get the current time value based on direction (up or down)
 * @returns {number} Current time value in milliseconds
 */
function getCurrentTimeValue() {
    const start = new Date(START_TIME).getTime();
    const target = new Date(TARGET_TIME).getTime();
    const now = Date.now();
    
    if (DIRECTION === 'up') {
        // Counting up from start_time (stopwatch mode)
        const elapsed = now - start;
        
        // Apply max_value limit if set
        if (MAX_VALUE !== null && elapsed > MAX_VALUE) {
            return MAX_VALUE;
        }
        
        // Apply min_value limit if set
        if (MIN_VALUE !== null && elapsed < MIN_VALUE) {
            return MIN_VALUE;
        }
        
        return elapsed;
    } else {
        // Counting down to target_time (classic mode)
        const remaining = target - now;
        
        // Apply min_value limit if set
        if (MIN_VALUE !== null && remaining < MIN_VALUE) {
            return MIN_VALUE;
        }
        
        // Apply max_value limit if set
        if (MAX_VALUE !== null && remaining > MAX_VALUE) {
            return MAX_VALUE;
        }
        
        return remaining;
    }
}

/**
 * Check if the timer has expired (only applies to down direction)
 * @returns {boolean} True if current time is past target time
 */
function isExpired() {
    if (DIRECTION === 'up') {
        return false; // Up direction never expires
    }
    const target = new Date(TARGET_TIME).getTime();
    const now = Date.now();
    return now >= target;
}

/**
 * Calculate the ratio of time remaining (1 = full time, 0 = expired)
 * @returns {number} Remaining ratio between 0 and 1
 */
function calculateRemainingRatio() {
    const start = new Date(START_TIME).getTime();
    const target = new Date(TARGET_TIME).getTime();
    const now = Date.now();
    
    if (DIRECTION === 'up') {
        // For up direction, ratio increases from 0 to 1
        const totalDuration = target - start;
        const elapsed = now - start;
        const progress = elapsed / totalDuration;
        return Math.min(1, Math.max(0, progress));
    } else {
        // For down direction, ratio decreases from 1 to 0
        const totalDuration = target - start;
        const elapsed = now - start;
        const progress = Math.max(0, Math.min(1, elapsed / totalDuration));
        return 1 - progress; // 1 = full time remaining, 0 = no time
    }
}

/**
 * Format time in milliseconds to display string
 * @param {number} ms - Milliseconds remaining
 * @returns {string} Formatted time string
 */
function formatTime(ms) {
    if (ms < 0) ms = 0;
    const totalSeconds = Math.floor(ms / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const milliseconds = ms % 1000;

    if (days >= 1000) {
        return `${days}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    } else if (days >= 100) {
        return `${days}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    } else if (days >= 10) {
        return `${days}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    } else if (days >= 1) {
        return `${days}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    } else if (hours >= 10) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    } else if (hours >= 1) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(Math.floor(milliseconds / 100))}`;
    } else if (minutes >= 10) {
        return `${String(minutes)}:${String(seconds).padStart(2, '0')}.${String(Math.floor(milliseconds / 10)).padStart(2, '0')}`;
    } else {
        return `${minutes}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}`;
    }
}

/**
 * Format negative time (for post-expiry display when on_expire is 'continue')
 * @param {number} ms - Milliseconds past target (negative value)
 * @returns {string} Formatted negative time string with minus sign
 */
function formatNegativeTime(ms) {
    const absMs = Math.abs(ms);
    const totalSeconds = Math.floor(absMs / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const milliseconds = absMs % 1000;

    let timeStr;
    if (days >= 1) {
        timeStr = `${days}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    } else if (hours >= 10) {
        timeStr = `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    } else if (hours >= 1) {
        timeStr = `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(Math.floor(milliseconds / 100))}`;
    } else if (minutes >= 10) {
        timeStr = `${String(minutes)}:${String(seconds).padStart(2, '0')}.${String(Math.floor(milliseconds / 10)).padStart(2, '0')}`;
    } else {
        timeStr = `${minutes}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}`;
    }
    return `-${timeStr}`;
}

/**
 * Get time elapsed since expiry
 * @returns {number} Milliseconds since target time was reached
 */
function getTimeSinceExpiry() {
    const target = new Date(TARGET_TIME).getTime();
    const now = Date.now();
    return now - target;
}

function getDarkerComplementaryColor(hex) {
    const rgb = hexToRgb(hex);
    const factor = 0.3;
    return rgbToHex(
        (255 - rgb.r) * factor,
        (255 - rgb.g) * factor,
        (255 - rgb.b) * factor
    );
}

function setDigit(element, value) {
    const segments = element.querySelectorAll('.segment-part');
    const num = parseInt(value);
    const color = getColor();

    if (!isNaN(num) && patterns[num]) {
        patterns[num].forEach((on, i) => {
            if (on) {
                segments[i].classList.add('on');
                segments[i].style.background = color;
                segments[i].style.boxShadow = `0 0 15px ${color}, 0 0 30px ${color}`;
            } else {
                segments[i].classList.remove('on');
                segments[i].style.background = complementary;
                segments[i].style.boxShadow = '';
            }
        });
    }
}

function updateDisplay(timeStr) {
    const display = document.getElementById('display');
    display.innerHTML = '';
    const colonCount = (timeStr.match(/:/g) || []).length;
    const isNegative = timeStr.startsWith('-');
    
    // Handle negative sign for negative time display
    if (isNegative) {
        const minusElement = createMinusSign();
        display.appendChild(minusElement);
        timeStr = timeStr.substring(1); // Remove the minus sign for parsing
    }

    if (colonCount === 3) {
        const parts = timeStr.split(':');
        const days = parts[0];
        const hours = parts[1] || '00';
        const minutes = parts[2] || '00';
        const seconds = parts[3] || '00';

        for (let i = 0; i < days.length; i++) {
            display.appendChild(createDigit());
            setDigit(display.lastChild, days[i]);
        }
        display.appendChild(createColon());
        display.appendChild(createDigit());
        setDigit(display.lastChild, hours[0]);
        display.appendChild(createDigit());
        setDigit(display.lastChild, hours[1]);
        display.appendChild(createColon());
        display.appendChild(createDigit());
        setDigit(display.lastChild, minutes[0]);
        display.appendChild(createDigit());
        setDigit(display.lastChild, minutes[1]);
        display.appendChild(createColon());
        display.appendChild(createDigit());
        setDigit(display.lastChild, seconds[0]);
        display.appendChild(createDigit());
        setDigit(display.lastChild, seconds[1]);
    } else if (colonCount === 2) {
        const parts = timeStr.split(':');
        const hours = parts[0];
        const minutes = parts[1] || '00';
        const secondsParts = (parts[2] || '00').split('.');
        const seconds = secondsParts[0] || '00';
        const decimals = secondsParts[1] || '';

        for (let i = 0; i < hours.length; i++) {
            display.appendChild(createDigit());
            setDigit(display.lastChild, hours[i]);
        }
        display.appendChild(createColon());
        display.appendChild(createDigit());
        setDigit(display.lastChild, minutes[0]);
        display.appendChild(createDigit());
        setDigit(display.lastChild, minutes[1]);
        display.appendChild(createColon());
        display.appendChild(createDigit());
        setDigit(display.lastChild, seconds[0]);
        display.appendChild(createDigit());
        setDigit(display.lastChild, seconds[1]);

        if (decimals.length > 0) {
            display.appendChild(createDecimal());
            for (let i = 0; i < decimals.length; i++) {
                display.appendChild(createDigit());
                setDigit(display.lastChild, decimals[i]);
            }
        }
    } else {
        const parts = timeStr.split(':');
        const minutes = parts[0];
        const secondsParts = (parts[1] || '00').split('.');
        const seconds = secondsParts[0] || '00';
        const decimals = secondsParts[1] || '';

        for (let i = 0; i < minutes.length; i++) {
            display.appendChild(createDigit());
            setDigit(display.lastChild, minutes[i]);
        }
        display.appendChild(createColon());
        display.appendChild(createDigit());
        setDigit(display.lastChild, seconds[0]);
        display.appendChild(createDigit());
        setDigit(display.lastChild, seconds[1]);
        display.appendChild(createDecimal());
        for (let i = 0; i < decimals.length; i++) {
            display.appendChild(createDigit());
            setDigit(display.lastChild, decimals[i]);
        }
    }

    // Apply color based on whether this is negative time
    if (isNegative) {
        applyNegativeTimeColor();
    } else {
        const color = getColor();
        applyColor(color);
    }
}

// Color update throttling state
let lastColorUpdate = 0;
let colorUpdateCounter = 0;

function setTargetColor(color) {
    targetColor = color;
    colorTransitionProgress = 0;
}

function updateColorTransition() {
    const remainingRatio = calculateRemainingRatio();
    const calculatedColor = getColorForRemainingRatio(remainingRatio);

    if (calculatedColor !== targetColor) {
        setTargetColor(calculatedColor);
    }

    // Throttle color updates based on remaining time
    // When >50% time remaining, update less frequently (every 10 calls)
    // When <50% time remaining, update more frequently (every 3 calls)
    // When <10% time remaining, update every call for smooth transition
    const now = Date.now();
    let shouldUpdate = false;

    if (remainingRatio > 0.5) {
        // Far from expiry - update every 300ms
        shouldUpdate = (now - lastColorUpdate) > 300;
    } else if (remainingRatio > 0.1) {
        // Getting close - update every 100ms
        shouldUpdate = (now - lastColorUpdate) > 100;
    } else {
        // Very close - update every 30ms for smooth transition
        shouldUpdate = (now - lastColorUpdate) > 30;
    }

    if (!shouldUpdate) {
        return;
    }

    lastColorUpdate = now;

    if (colorTransitionProgress < 1) {
        colorTransitionProgress += 0.1;
        if (colorTransitionProgress > 1) colorTransitionProgress = 1;

        currentColor = lerpColor(currentColor, targetColor, colorTransitionProgress);

        if (colorTransitionProgress >= 1) {
            currentColor = targetColor;
        }

        applyColor(currentColor);
    }
}

/**
 * Request browser notification permission
 * @returns {Promise<string>} Permission status: 'granted', 'denied', or 'default'
 */
async function requestNotificationPermission() {
    if (!('Notification' in window)) {
        console.log('[Notification] Browser does not support notifications');
        notificationPermission = 'denied';
        return 'denied';
    }

    if (Notification.permission === 'granted') {
        notificationPermission = 'granted';
        return 'granted';
    }

    if (Notification.permission === 'denied') {
        notificationPermission = 'denied';
        return 'denied';
    }

    try {
        const permission = await Notification.requestPermission();
        notificationPermission = permission;
        console.log('[Notification] Permission:', permission);
        return permission;
    } catch (e) {
        console.warn('[Notification] Error requesting permission:', e);
        notificationPermission = 'denied';
        return 'denied';
    }
}

function sendExpiryNotification() {
    if (!('Notification' in window)) {

            tag: 'timer-expired',

        });

        notification.onclick = () => {

/**
 * Handle timer expiry - called once when timer reaches zero
 */
function handleExpiry() {
    if (expiryHandled) return;
    expiryHandled = true;
    hasExpired = true;

    console.log('[Timer] Timer expired!');

    // Add expired class for visual effects
    document.body.classList.add('expired');

    // Update document title
    const displayName = DISPLAY_NAME || '7 Segment Timer';
    document.title = `EXPIRED - ${displayName}`;

    // Send browser notification if enabled
    if (!expiryNotified) {
        sendExpiryNotification();
        expiryNotified = true;
    }

    // Handle on_expire behavior
    const onExpire = ON_EXPIRE || 'stop';
    
    if (onExpire === 'hide') {
        // Hide display, show message
        showExpiredMessage();
    } else if (onExpire === 'continue') {
        // Continue showing negative time
        console.log('[Timer] Continuing with negative time display');
    }
    // 'stop' is default - just freeze at 00:00:00:00
}

/**
 * Update countdown display
 */
function updateCountdown() {
    // Skip update if paused
    if (isPaused) return;

    // Use the new direction-aware time value function
    const currentTimeValue = getCurrentTimeValue();
    
    // For down direction, check if expired
    if (DIRECTION === 'down' && isExpired()) {
        if (!hasExpired) {
            handleExpiry();
        }

        // Handle different expiry behaviors
        const onExpire = ON_EXPIRE || 'stop';

        if (onExpire === 'continue') {
            // Show negative time
            const elapsed = getTimeSinceExpiry();
            const timeStr = formatNegativeTime(elapsed);
            updateDisplay(timeStr);
            document.title = `${timeStr.split('.')[0]} - ${DISPLAY_NAME || 'Timer'}`;
        } else if (onExpire !== 'hide') {
            // Stop at zero (default behavior)
            updateDisplay('00:00:00:00');
        }
        // 'hide' is handled by showExpiredMessage()
        return;
    }

    // For up direction, just display elapsed time
    if (DIRECTION === 'up') {
        const timeStr = formatTime(currentTimeValue);
        updateDisplay(timeStr);
        document.title = `${timeStr.split('.')[0]} - ${DISPLAY_NAME || 'Timer'}`;
        return;
    }

    // For down direction (not expired yet)
    const timeStr = formatTime(Math.max(0, currentTimeValue));
    updateDisplay(timeStr);

    // Update document title
    const displayName = DISPLAY_NAME || '7 Segment Timer';
    document.title = `${timeStr.split('.')[0]} - ${displayName}`;
}

    if (document.hidden) {
        isDocumentVisible = false;
        // Reduce update frequency when hidden
        if (updateInterval) {
            clearInterval(updateInterval);
            updateInterval = setInterval(updateCountdown, 1000); // Update once per second
        }
        if (colorInterval) {
            clearInterval(colorInterval);
            colorInterval = setInterval(updateColorTransition, 1000); // Update once per second
        }
        console.log('[Timer] Tab hidden, reducing update frequency');
    } else {
        isDocumentVisible = true;
        // Restore normal update frequency
        if (updateInterval) {
            clearInterval(updateInterval);
            updateInterval = setInterval(updateCountdown, updateIntervalMs);
        }
        if (colorInterval) {
            clearInterval(colorInterval);
            colorInterval = setInterval(updateColorTransition, colorIntervalMs);
        }
        lastRealTime = Date.now();
        console.log('[Timer] Tab visible, restoring normal frequency');
    }
});

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
            e.preventDefault();
            togglePause();
        }
        if (e.code === 'KeyF') {
            toggleFullscreen();
        }
        if (e.code === 'KeyH') {
            toggleHide();
        }
    });
}

/**
 * Toggle notification permission
 */
async function toggleNotifications() {
    const notifBtn = document.getElementById('notifBtn');
    if (!notifBtn) return;

    const currentPermission = getNotificationPermission();
    
    if (currentPermission === 'granted') {
        // Can't revoke, but we can indicate it's enabled
        notifBtn.textContent = '🔔 Notify';
        notifBtn.title = 'Notifications enabled';
        alert('Notifications are already enabled. To disable, use browser settings.');
    } else {
        const result = await requestNotificationPermission();
        if (result === 'granted') {
            notifBtn.textContent = '🔔 Notify';
            notifBtn.title = 'Notifications enabled';
            // Send a test notification
            try {
                new Notification('Notifications Enabled!', {
                    body: 'You will be notified when the timer expires.',
                    tag: 'test-notification'
                });
            } catch (e) {
                console.log('Test notification error:', e);
            }
        } else {
            notifBtn.textContent = '🔕 Notify';
            notifBtn.title = 'Notifications denied';
        }
    }
}

function addDisplayName() {
    if (!DISPLAY_NAME) return;

    const nameEl = document.createElement('div');
    nameEl.className = 'timer-display-name';
    nameEl.textContent = DISPLAY_NAME;
    document.body.appendChild(nameEl);
}

/**
 * Update watermark color based on build age
 * Fresh (built today) = cyan/green, Old = orange/red
 */
function updateWatermarkAge() {
    const watermark = document.querySelector('.version-watermark');
    if (!watermark) return;
    
    const buildDate = watermark.dataset.build;
    if (!buildDate) return;
    
    // Parse: 2.0.0.20260325123452.stable
    const parts = buildDate.split('.');
    if (parts.length < 3) return;
    
    const timestamp = parts[2]; // 20260325123452
    try {
        // Parse timestamp: YYYYMMDDHHMMSS
        const year = parseInt(timestamp.slice(0, 4));
        const month = parseInt(timestamp.slice(4, 6));
        const day = parseInt(timestamp.slice(6, 8));
        
        const now = new Date();
        
        // Check if built today (same calendar day)
        const isToday = (day === now.getDate() && 
                        month === (now.getMonth() + 1) && 
                        year === now.getFullYear());
        
        if (isToday) {
            watermark.dataset.age = 'fresh';
        } else {
            watermark.dataset.age = 'old';
        }
    } catch (e) {
        console.log('Watermark age check error:', e);
    }
}

/**
 * Show/hide watermark based on cursor proximity to bottom-right corner
 */
function setupWatermarkVisibility() {
    const watermark = document.querySelector('.version-watermark');
    if (!watermark) return;

    const showThreshold = 200; // pixels from corner

    document.addEventListener('mousemove', (e) => {
        const rect = watermark.getBoundingClientRect();
        const distX = Math.abs(e.clientX - rect.left);
        const distY = Math.abs(e.clientY - rect.top);

        // Show if cursor is near the watermark
        if (distX < showThreshold && distY < showThreshold) {
            watermark.classList.add('visible');
        } else {
            watermark.classList.remove('visible');
        }
    });
}

/**
 * Toggle pause/resume
 */
function togglePause() {
    isPaused = !isPaused;
    const pauseBtn = document.getElementById('pauseBtn');

    if (isPaused) {
        pausedAt = Date.now();
        console.log('[Timer] Paused');
        document.body.classList.add('paused');
        if (pauseBtn) pauseBtn.textContent = '▶️';
    } else {
        pauseOffset += Date.now() - pausedAt;
        console.log('[Timer] Resumed');
        document.body.classList.remove('paused');
        if (pauseBtn) pauseBtn.textContent = '⏸️';
    }
}

/**
 * Toggle hide/show controls
 */
let controlsVisible = true;
function toggleHide() {
    const controls = document.querySelector('.timer-controls');
    const displayName = document.querySelector('.timer-display-name');

    controlsVisible = !controlsVisible;

    if (controls) {
        controls.style.opacity = controlsVisible ? '1' : '0';
        controls.style.pointerEvents = controlsVisible ? 'auto' : 'none';
    }

    if (displayName) {
        displayName.style.opacity = controlsVisible ? '1' : '0';
    }

    console.log('[Timer] Controls', controlsVisible ? 'shown' : 'hidden');
}

/**
 * Toggle fullscreen
 */
function toggleFullscreen() {
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            console.log('[Fullscreen] Error:', err);
        });
        if (fullscreenBtn) {
            fullscreenBtn.textContent = '⛶ Exit';
        }
    } else {
        document.exitFullscreen();
        if (fullscreenBtn) {
            fullscreenBtn.textContent = '⛶';
        }
    }
}

// Start initialization
init();

// Update watermark age and setup visibility after a short delay
setTimeout(() => {
    updateWatermarkAge();
    setupWatermarkVisibility();
}, 500);

    </script>
</body>
